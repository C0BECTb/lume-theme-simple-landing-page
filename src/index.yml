###

header:
  title: The only <span>fast food</span> that is good for your health!
  description: *description
  captions: ~
  picture:
    src: /images/BurgerFries.svg
    blur_hash: R0lGODlhBAAEAPIAAAAAAMiWHrZ4GOCEMN95PN2JMwAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMICBEwVSJCxRIAOw==
    alt:
      Illustration of a cheeseburger with sesame seed bun, layered with lettuce, cheese, and tomato, next to a box of fries.
      Background is transparent.

sections:
  - id: posts-top
    posts:
      - Description:
          - This is a demo of the <b>Simple Landing Page theme</b> for <b>Lume</b>, inspired by the <a href="https://t.me/durgerkingbot">Durger King Telegram bot</a>.
          - It is built with <b>Apple Color Emoji, One Dark & One Light</b> color schemes, and <b>IBM Plex®</b> typography.

  - id: cards
    nav: true
    icon: *storefront
    cards:
      - title: Cake
        price:
          - old: 🌟1
        picture:
          src: /images/products/Cake.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAANWbeNa8j+jLlufGiuPGmQAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMJCCEgVWO8IWJIADs=
          alt: Shortcake Emoji.
            A slice of strawberry shortcake, layered with whipped cream and topped with a whole strawberry.
            Like the Birthday Cake, may be used to represent birthday celebrations or cake in general.

      - title: Burger
        description: |
          Meat™
        price:
          - old: $4.99
            new: $3.99
        badge:
          - color: red
        picture:
          src: /images/products/Burger.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAAK1+QZdhHbJzN6p0J+WmXAAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMJCBEgVcIREchMADs=
          alt: Hamburger Emoji.
            A burger with a beef patty, usually depicted on a sesame bun with cheese, lettuce, and tomato—making it a cheeseburger,
            though officially called Hamburger by Unicode.

      - title: Fries
        description: |
          Po-ta-toes
        price:
          - old: $1.49
        badge:
          - title: Popular
            color: blue
        picture:
          src: /images/products/Fries.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAANQ5ItIsG+dfKuqVHAAAAAAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMJCApBpGMoIUACADs=
          alt: French Fries Emoji.
            Thin-cut, golden-brown French fries, served in a red carton, as at McDonald’s.
            Apple features Smiling Face With Smiling Eyes on its carton.

      - title: Hotdog
        description: |
          0% Dog, 100% hot
        price:
          - old: $3.49
        picture:
          src: /images/products/Hotdog.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAAK0wGs9gANd/JeuiNwAAAAAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMIOANAtMJBEhIAOw==
          alt: Hot Dog Emoji.
            The cooked sausage of a hot dog in a sliced bun and drizzled with yellow mustard, as eaten at a baseball game.

      - title: Taco
        description: |
          Mucho más
        price:
          - old: $3.99
        picture:
          src: /images/products/Taco.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAAMZsA4lkGNamNIF0KtSgMAAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMKCDMqVYSUIAQACQA7
          alt: Taco Emoji.
            A Mexican or Tex-Mex taco on a hard or soft corn tortilla, filled with such ingredients as beef, lettuce, tomato, cheese, and onion.
            Apple’s design resembles a carne asada taco, with cilantro and white onion.

      - title: Pizza
        description: |
          That's amore
        price:
          - old: $7.99
        badge:
          - title: NEW
            color: yellow
        picture:
          src: /images/products/Pizza.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAAOCCN9NvKuimS+KYVgAAAAAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMJCCMgDoAwGEACADs=
          alt: Pizza Emoji.
            A slice of pepperoni pizza.

      - title: Donut
        description: |
          Hole included
        price:
          - old: $1.49
        picture:
          src: /images/products/Donut.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAALVyLJ9eP4hdN5laLQAAAAAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMICCJAPsORNhMAOw==
          alt: Doughnut Emoji.
            A chocolate-glazed donut (or doughnut) with rainbow sprinkles.
            May resemble the Bagel at small sizes.

      - title: Popcorn
        description: |
          Lights, camera, corn
        price:
          - old: $1.99
        badge:
          - title: NEW
            color: yellow
        picture:
          src: /images/products/Popcorn.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAAOmDf/fYkNtcZffTjfCXhe6ybwAAACH5BAEAAAAALAAAAAAEAAQAAAMICBFa1gOAERMAOw==
          alt: Popcorn Emoji.
            The buttery-white snack of popcorn brimming in a classic red-and-white-striped carton, as enjoyed at a movie theater.

      - title: Coke
        description: |
          The liquid kind
        price:
          - old: $1.49
        badge:
          - title: Best seller
            color: violet
        picture:
          src: /images/products/Coke.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAANN0fc9OXMGNks1ibQAAAAAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMICKpDKkKFABIAOw==
          alt: Cup with Straw Emoji.
            A drinking cup with a straw.
            Depicted on many platforms as a disposable cup with a lid and bendy straw, as used to serve soft drinks at fast-food restaurants.
            May be used for a range of non-alcoholic beverages, including milkshakes, smoothies, juice, and to-go beverages.

      - title: Icecream
        description: |
          Cone of shame
        price:
          - old: $5.99
        picture:
          src: /images/products/Icecream.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAAOTDkte0hPXx6eXTuAAAAAAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMJCDMARE2IFgJIADs=
          alt: Soft Ice Cream Emoji.
            A swirl of soft-serve ice cream atop a wafer-style cone, white or cream-colored, as vanilla, on most platforms.
            May be used more generally for ice cream, frozen yogurt, and frozen treats.

      - title: Cookie
        description: |
          Milk's favorite
        price:
          - old: $3.99
        badge:
          - title: Sold out
            color: fg
        semi_transparent: true
        picture:
          src: /images/products/Cookie.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAALR6R41PLOO7dKt+SaFtOgAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMJCDNKJIIUASBIADs=
          alt: Cookie Emoji.
            A golden-brown chocolate chip cookie or biscuit.
            Used to represent cookies or biscuits in general.

      - title: Flan
        description: |
          Flan-tastic
        price:
          - old: $7.99
        picture:
          src: /images/products/Flan.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAAN7Tx8B7TtCfctvGo8CwoAAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMJCAoxEmSMskACADs=
          alt: Custard Emoji.
            A golden-yellow custard dessert, as a crème caramel or flan, topped with a layer of caramel.
            Shown on a plate, molded in a ramekin-shape and often in a pool of caramel sauce.

  - id: posts-middle
    posts:
      - Did you know?:
          - You can add <b>Cards</b>, as shown above, and <b>Catalog</b>, as shown below.

  - id: catalog
    nav: true
    icon: *lists
    catalog:
      - title: Sandwich
        long:
          - Description: |
              Lunch-ready stack of white/wheat slices hugging lettuce, tomato, cheese, and a folded slice of deli ham
          - Ingredients: |
              wheat bread, lettuce, tomato, cheddar, ham, mayo
        short:
          - Qty: 1
          - Weight: 170 g
          - Cal.: 380
        price:
          - old: $4.99
        picture:
          src: /images/products/Sandwich.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAAPnosKaDN/n3vdOlWfXgnwAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMJCBBAVUSQCIRKADs=
          alt: Sandwich Emoji.
            A sandwich, as eaten at lunch, made with lettuce, tomato, and cheese on slices of white or wheat bread.
            Apple, Google, and WhatsApp add a deli meat that resembles ham.

      - title: Burrito
        long:
          - Description: |
              Foil-wrapped flour tortilla bulging with a classic Mission-district mix
          - Ingredients: |
              flour tortilla, seasoned beef, cilantro-lime rice, black beans, shredded cheese, pico, sour cream
        short:
          - Qty: 1
          - Weight: 280 g
          - Cal.: 550
        price:
          - old: $5.49
        badge:
          - title: Popular
            color: blue
        picture:
          src: /images/products/Burrito.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAAL64pYyDbJ6BV727tgAAAAAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMJOBOgBIJIAEhIADs=
          alt: Burrito Emoji.
            A Mexican or Tex-Mex burrito, featuring a wrapped flour tortilla filled with such ingredients as beef, rice, beans, cheese, tomato, lettuce, and sour cream.
            Served in foil on several major platforms, suggesting a Mission burrito associated with San Francisco.

      - title: Tamale
        long:
          - Description: |
              Single corn-husk parcel hiding steamy masa
          - Ingredients: |
              corn husk, masa harina, chicken, red chile sauce, cumin
        short:
          - Qty: 1
          - Weight: 120 g
          - Cal.: 220
        price:
          - old: $3.49
        badge:
          - title: NEW
            color: yellow
        picture:
          src: /images/products/Tamale.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAAMiSOLR9LZNfIdqmRc6bNwAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMJCBBbRGMUJlQCADs=
          alt: Tamale Emoji.
            A single tamale wrapped in a corn husk.

      - title: Stuffed Flatbread
        long:
          - Description: |
              Pillowy pita pocket crammed like a late-night shawarma
          - Ingredients: |
              pita, shaved lamb, lettuce, tomato, red onion, cucumber, tahini
        short:
          - Qty: 1
          - Weight: 250 g
          - Cal.: 480
        price:
          - old: $4.49
        picture:
          src: /images/products/Stuffed Flatbread.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAAJOESHRsLn96Rpt2S6yRWAAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMJCBAsQmKUsGgCADs=
          alt: Stuffed Flatbread Emoji.
            A flatbread, like pita, stuffed with lettuce, tomato, and/or meat.
            Resembles a doner kebab, falafel, shawarma, or gyro sandwich, popular in the Middle East and the Mediterranean.
            Some platforms have red onion and cucumber.

      - title: Falafel
        long:
          - Description: |
              Three golden chickpea orbs, one split to show the green herb center
          - Ingredients: |
              chickpeas, parsley, garlic, cumin, coriander, sesame-seed crust
        short:
          - Qty: 10
          - Weight: 300 g
          - Cal.: 930
        price:
          - old: $9.99
            new: $7.49
        badge:
          - color: red
        picture:
          src: /images/products/Falafel.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAAIhuW3FcMoRvU6ugiYWBYwAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMKCAohEkWMEsYICQA7
          alt: Falafel Emoji.
            Brown spheres depicting falafel, a food popular in Middle Eastern and North African cuisine, typically made of mashed chickpeas or fava beans.
            Most platforms include three or more falafel with one piece split open to reveal a green center.

      - title: Fondue
        long:
          - Description: |
              Ruby pot bubbling with molten Swiss cheese and peeking forks
          - Ingredients: |
              Gruyère, Emmental, white wine, garlic, kirsch, nutmeg
        short:
          - Qty: 1
          - Weight: 200 g
          - Cal.: 460
        price:
          - old: $8.99
        badge:
          - title: NEW
            color: yellow
        picture:
          src: /images/products/Fondue.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAANlqYUsFA3kVEKcmJNGdhNmtjwAAACH5BAEAAAAALAAAAAAEAAQAAAMJCAphFYNIIARIADs=
          alt: Fondue Emoji.
            A red fondue pot.
            Most platforms show cheese fondue with fondue forks sticking out of the pot.

      - title: Bento Box
        long:
          - Description: |
              Compartmentalized Japanese lunchbox balancing land and sea
          - Ingredients: |
              steamed rice, kara-age chicken, fried shrimp, pickled plum, broccoli
        short:
          - Qty: 1
          - Weight: 450 g
          - Cal.: 700
        price:
          - old: $9.99
            new: $8.99
        badge:
          - color: red
        picture:
          src: /images/products/Bento Box.svg
          blur_hash: R0lGODlhBAAEAPIAAHpVRgAAALp4P7V+WbyimZCgXQAAAAAAACH5BAEAAAEALAAAAAAEAAQAAAMKGCExIgMUQoAFCQA7
          alt: Bento Box Emoji.
            A Japanese bento, a lunch box divided into portions of rice, vegetables, and meat or seafood, such as sushi or fried shrimp.

      - title: Rice Cracker
        long:
          - Description: |
              Crispy wheel of senbei wearing a nori belt
          - Ingredients: |
              glutinous rice, soy sauce, mirin, nori strip
        short:
          - Qty: 1
          - Weight: 15 g
          - Cal.: 60
        price:
          - old: $1.49
        reversed: true
        picture:
          src: /images/products/Rice Cracker.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAADk/IDdAIJ52KsmZQtOpS8KFMwAAACH5BAEAAAAALAAAAAAEAAQAAAMKCFZk80OIAUIACQA7
          alt: Rice Cracker Emoji.
            A Japanese senbei, or rice cracker, wrapped with a sheet of nori, or seaweed, a snack commonly enjoyed with green tea.

      - title: Rice Ball
        long:
          - Description: |
              Triangular onigiri clutching a salty core
          - Ingredients: |
              sushi rice, umeboshi plum, nori wrap, salt
        short:
          - Qty: 1
          - Weight: 110 g
          - Cal.: 190
        price:
          - old: $1.99
        badge:
          - title: Best seller
            color: violet
        reversed: true
        picture:
          src: /images/products/Rice Ball.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAAM/Pxjc5MElOO9DNxM7HwsjFvwAAACH5BAEAAAAALAAAAAAEAAQAAAMJCBFaRWYMJ4RJADs=
          alt: Rice Ball Emoji.
            A Japanese onigiri, a cone-shaped ball of white rice, a snack wrapped with a sheet of nori, or seaweed.

      - title: Cooked Rice
        long:
          - Description: |
              Plain bowl of snow-white grain simplicity
          - Ingredients: |
              short-grain rice, water, optional kombu dashi
        short:
          - Qty: 1
          - Weight: 160 g
          - Cal.: 240
        price:
          - old: $1.99
        picture:
          src: /images/products/Cooked Rice.svg
          blur_hash: R0lGODlhBAAEAPIAAMG/vQAAANbUzb28u8G8u9jW0wAAAAAAACH5BAEAAAEALAAAAAAEAAQAAAMJGFWwNGONAEMCADs=
          alt: Cooked Rice Emoji.
            A bowl of steamed white rice, a staple component of cuisine throughout Asia.
            Bowl color varies across platforms, though is often white.

      - title: Curry Rice
        long:
          - Description: |
              Rust-colored Japanese curry ladled next to fluffy rice
          - Ingredients: |
              white rice, potatoes, carrots, onions, beef, curry roux
        short:
          - Qty: 1
          - Weight: 350 g
          - Cal.: 620
        price:
          - old: $6.49
        picture:
          src: /images/products/Curry Rice.svg
          blur_hash: R0lGODlhBAAEAPIAAAAAANzKu9G6q8KNb8y8o8fAtwAAAAAAACH5BAEAAAAALAAAAAAEAAQAAAMJCApRAoSMAcRLADs=
          alt: Curry Rice Emoji.
            A plate of orange-brown curry with vegetables or meat, served with a mound of white rice.
            May represent kare-raisu, or Japanese curry, though commonly associated with India and other Asian cuisines.

      - title: Steaming Bowl
        long:
          - Description: |
              Ramen noodles swimming in smoky dashi under rising steam
          - Ingredients: |
              chijire noodles, pork chashu, soft egg, negi, nori
        short:
          - Qty: 1
